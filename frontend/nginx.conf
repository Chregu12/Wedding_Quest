server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip for the Angular bundle
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ─── Backend routing (single origin, no CORS) ───
    # Trailing slash on proxy_pass strips the location prefix, so the
    # backend sees its native routes (e.g. /sessions, /games, /scores).

    location /api/session/ {
        proxy_pass http://session-service:3002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/engine/ {
        proxy_pass http://engine-service:3003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/scoring/ {
        proxy_pass http://scoring-service:3004/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── WebSocket (realtime-service) ───
    # No trailing slash: the original /ws/<sessionId> path is preserved.
    location /ws/ {
        proxy_pass http://realtime-service:3006;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ─── Angular SPA (client-side routing fallback) ───
    location / {
        try_files $uri $uri/ /index.html;
    }
}
